name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  analyze:
    name: Analyze, archive and publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Flutter, not just the Dart SDK: pub resolves `example/` too, and that
      # is a Flutter application, so `dart pub get` alone fails with
      # "flutter_test from sdk which doesn't exist".
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          dart analyze
          # The package root run does not look at hook/.
          dart analyze hook

      # Packs the package exactly as `dart pub publish` would, and fails if a
      # part of the library would be left out - which is how `lib/src/wasmtime/`
      # once shipped missing, from an unrooted `wasmtime/` in .pubignore.
      - name: Publish dry run and archive check
        run: |
          set -euo pipefail
          dart pub publish --dry-run | tee /tmp/dry-run.txt

          status=0
          for name in \
            lib/webassembly.dart lib/wasmtime.dart lib/parallel.dart lib/raw.dart \
            src/api/webassembly.dart src/api/backend_io.dart src/api/backend_web.dart \
            src/ffi/handles.dart src/ffi/errors.dart src/ffi/values.dart \
            src/parallel/worker.dart src/parallel/pool.dart \
            src/wasmtime/engine.dart src/wasmtime/store.dart src/wasmtime/module.dart \
            src/wasmtime/linker.dart src/wasmtime/handles.dart src/wasmtime/types.dart \
            src/toolchain/wasmtime_sources.dart src/wasmtime_bindings_generated.dart \
            hook/build.dart src/CMakeLists.txt ffigen.yaml LICENSE CHANGELOG.md; do
            # The dry run prints a tree, so only the last path segment can be
            # matched; that is enough to catch a whole directory going missing.
            if ! grep -qF "${name##*/}" /tmp/dry-run.txt; then
              echo "::error file=$name::$name is missing from the published archive"
              status=1
            fi
          done
          exit "$status"

      # What pana does before scoring a release.  `dart analyze` does not look
      # at build hooks - they are compiled rather than analysed - so the hook
      # check in .github/check_hooks.py runs as well; that is what caught
      # platform 3.0.0, whose `Platform.packageRoot` current SDKs removed.
      - name: The lowest allowed dependencies still work
        run: |
          set -euo pipefail
          dart pub downgrade --no-example
          dart analyze
          python3 .github/check_hooks.py
          dart pub upgrade

  test:
    name: Native tests (wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # wasmtime's cargo target directory, which is the expensive part.
          workspaces: wasmtime

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # `dart test` runs the build hook, which compiles wasmtime from source,
      # and then the tests: the wasmtime API, the unified API, the isolate
      # workers and pools, and where the hook gets its sources from.
      #
      # The submodule is used here so that the cargo cache applies; that a
      # checkout *downloaded* the way a published package does builds just as
      # well was verified by hand - see "Published path" in the README.
      - name: Test
        run: dart test
        env:
          # Also fetch the pinned wasmtime revision into the cache, which is
          # step one of what happens for everyone who installs from pub.dev.
          WASMTIME_DOWNLOAD_TEST: '1'

  web-test:
    name: Web tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The same platform neutral test file as `dart test` runs above, only
      # against the browser's own WebAssembly.  The build hook skips its native
      # work for a web target, so this is quick.
      - name: Test in Chrome
        run: dart test -p chrome test/unified_api_test.dart

  web-build:
    name: Example builds for the web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: example

      - run: flutter analyze
        working-directory: example

      - run: flutter build web
        working-directory: example

  windows-build:
    name: Example builds for Windows
    runs-on: windows-latest
    timeout-minutes: 180
    # Pushes to master and manual runs; pull requests skip it, because it
    # compiles all of wasmtime whenever the cache is cold.  Drop this line to
    # check it on every pull request too.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasmtime

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: example

      - run: flutter build windows
        working-directory: example

      - name: The output bundles wasmtime
        shell: pwsh
        run: |
          $library = 'example\build\windows\x64\runner\Release\wasmtime.dll'
          if (-not (Test-Path $library)) {
            throw "wasmtime.dll was not bundled with the application"
          }
          Get-Item $library | Select-Object Name, Length
