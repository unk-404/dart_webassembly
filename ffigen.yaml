# Bindings for the wasmtime C API (`wasmtime/crates/c-api/include/wasmtime.h`).
#
# Regenerate with:
#     cmake -S src -B build/ffigen-conf   # writes build/ffigen/include/wasmtime/conf.h
#     dart run ffigen --config ffigen.yaml
name: Wasmtime
description: |
  Dart FFI bindings for the wasmtime C API.

  Generated from wasmtime/crates/c-api/include/wasmtime.h.
output: 'lib/src/wasmtime_bindings_generated.dart'
headers:
  entry-points:
    - 'wasmtime/crates/c-api/include/wasmtime.h'
  include-directives:
    - '**/crates/c-api/include/*.h'
    - '**/crates/c-api/include/wasmtime/*.h'
# ffigen only auto-detects libclang in `C:\Program Files\LLVM`; on this machine
# it ships with Visual Studio's LLVM tools.
llvm-path:
  - 'D:/Devel/Microsoft/VS/18/Community/VC/Tools/Llvm/x64'
  - 'C:/Program Files/LLVM'
compiler-opts:
  # `wasmtime/conf.h` is generated by configuring src/CMakeLists.txt; it selects
  # the parts of the C API that were compiled into the shared library.
  - '-Ibuild/ffigen/include'
  # The wasmtime headers include each other with <angle> includes, which clang
  # only resolves through the include path.
  - '-Iwasmtime/crates/c-api/include'
# The C API stores opaque handles in fields called `__private`.  Leading
# underscores make those members library-private in Dart, so code outside this
# generated file cannot read or copy a `wasmtime_func_t` at all (which the
# funcref value model needs).  Renaming them makes them usable; the layout and
# the ABI are unchanged.
structs:
  member-rename:
    '.*':
      '^__private$': 'privateData'
      '^__private1$': 'privateData1'
      '^__private2$': 'privateData2'
      '^__private3$': 'privateData3'
ffi-native:
  # Must match the code asset registered by hook/build.dart.
  asset-id: 'package:flutter_wasm/wasmtime.dart'
comments:
  style: any
  length: full
