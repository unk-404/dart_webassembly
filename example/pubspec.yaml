name: webassembly_example
description: "Runs a WebAssembly module with package:webassembly, on Windows and on the web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # The package under test. A real application would depend on a version:
  #   webassembly: ^0.1.0
  webassembly:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # A module that imports `env.log` and exports `add` and `greet`; assembled
    # from WAT by the fixture generator, see the package's test/fixtures.
    - assets/demo.wasm

